# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:
    desc: "Install homelab environment"
    cmds:
      - python -m venv .venv
      - . .venv/bin/activate && pip install -r requirements.txt

  setup:
    desc: "Run the bootstrap setup script"
    cmds:
      - bash {{.ROOT_DIR}}/scripts/bootstrap.sh {{.CLI_ARGS}}

  new:
    desc: Create new service
    cmds:
      - . .venv/bin/activate && copier copy {{.ROOT_DIR}}/resources/service_template {{.ROOT_DIR}}/services/

  up:
    dir: "{{.USER_WORKING_DIR}}"
    desc: Start docker service
    cmds:
      - docker compose up -d

  down:
    dir: "{{.USER_WORKING_DIR}}"
    desc: Stop docker service
    cmds:
      - docker compose down

  update:
    dir: "{{.USER_WORKING_DIR}}"
    desc: Update docker service
    cmds:
      - docker compose down
      - docker compose pull
      - docker compose up -d

  update-all:
    desc: Update all Docker services
    cmds:
      - python {{.ROOT_DIR}}/scripts/runtime/run_commands.py {{.ROOT_DIR}}/services --cmd 'docker compose pull'
      - python {{.ROOT_DIR}}/scripts/runtime/run_commands.py {{.ROOT_DIR}}/services --cmd 'docker compose up -d'

  stop-all:
    desc: Stop all Docker services
    cmds:
      - docker stop $(docker ps -a -q)

  restart-all:
    desc: Restart all Docker services
    cmds:
      - docker restart $(docker ps -a -q)

  backup:
    desc: Backup all service configs and data
    cmds:
      - python {{.ROOT_DIR}}/scripts/runtime/backup.py {{.ROOT_DIR}} {{.ROOT_DIR}}/backups
